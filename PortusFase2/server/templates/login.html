<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTUS - Inicio de Sesion</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #1b263b 0%, #0a0e17 100%);
    }
    .login-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent-cyan);
    }
    .login-sub {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }
    .form-group input:focus {
      border-color: var(--accent-blue);
    }
    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: var(--accent-blue);
      border: none;
      border-radius: 4px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .btn-login:hover {
      background-color: #0070d6;
    }
    .error-msg {
      background: rgba(255, 61, 0, 0.15);
      border: 1px solid var(--status-red);
      color: var(--status-red);
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 16px;
      display: none;
    }
    .demo-credentials {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
    }
    .demo-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .demo-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .demo-chip {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
    }
    .demo-chip:hover {
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">PORTUS</div>
      <div class="login-sub">Acceso a Plataforma Operativa | Fase 2</div>
    </div>

    <div id="errorAlert" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input type="text" id="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Ingresar a la Terminal</button>
    </form>

    <div class="demo-credentials">
      <div class="demo-title">Credenciales de evaluacion (clic para cargar):</div>
      <div class="demo-chips">
        <button class="demo-chip" onclick="fillCreds('operador1', 'terminal123')">Terminal: operador1</button>
        <button class="demo-chip" onclick="fillCreds('maersk', 'maersk123')">Naviera 1: maersk</button>
        <button class="demo-chip" onclick="fillCreds('msc', 'msc123')">Naviera 2: msc</button>
        <button class="demo-chip" onclick="fillCreds('agente1', 'agente123')">Agente: agente1</button>
        <button class="demo-chip" onclick="fillCreds('sat1', 'sat123')">Autoridad: sat1</button>
      </div>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const errBox = document.getElementById('errorAlert');
      errBox.style.display = 'none';

      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username: u, password: p})
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
          window.location.href = data.redirect;
        } else {
          errBox.textContent = data.error || 'Fallo de autenticacion';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.textContent = 'Error de conexion con el servidor';
        errBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
